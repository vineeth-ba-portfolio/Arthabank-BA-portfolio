<body>
<h2>ArthaBank – Digital Loan Processing System</h2>
<p>To-Be BPMN Diagram | Digital Vehicle Loan Process (Future State) | Prepared by: Joga Sai Vineeth | June 2026</p>
<svg width="100%" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">

  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>

  <!-- Title bar -->

  <rect x="10" y="196" width="70" height="120" fill="#2E75B6" stroke="#2E75B6" stroke-width="0.5"/>
  <text x="45" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial" transform="rotate(-90,45,256)">SYSTEM</text>

  <line x1="479" y1="432" x2="518" y2="432" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <line x1="474" y1="316" x2="479" y2="316" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="479" y1="316" x2="479" y2="336" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="745" y1="216" x2="745" y2="144" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="745" y1="576" x2="675" y2="576" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>

  <polygon points="720,676 734,666 748,676 734,686" fill="none" stroke="#333" stroke-width="1.2"/>
