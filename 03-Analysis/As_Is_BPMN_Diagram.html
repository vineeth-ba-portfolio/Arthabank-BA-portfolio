<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ArthaBank – As-Is BPMN Diagram</title>
<style>
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 20px; }
  h2 { color: #1F4E79; font-size: 16px; margin-bottom: 4px; }
  p { color: #555; font-size: 12px; margin-bottom: 16px; }
  svg text { font-family: Arial, sans-serif; }
  .lane-label { font-size: 11px; font-weight: bold; fill: #1F4E79; }
  .task { font-size: 10px; }
  .task-title { font-size: 10px; font-weight: bold; }
  .note { font-size: 10px; font-style: italic; fill: #888; }
</style>
</head>
<body>
<h2>ArthaBank – Digital Loan Processing System</h2>
<p>As-Is BPMN Diagram | Manual Vehicle Loan Process | Prepared by: Joga Sai Vineeth | June 2026</p>
<svg width="100%" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="10" y="8" width="880" height="32" rx="6" fill="#1F4E79"/>
  <text x="450" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Arial">As-Is BPMN — ArthaBank Manual Vehicle Loan Process (Current State)</text>

  <!-- SWIMLANE BORDERS -->
  <!-- Customer -->
  <rect x="10" y="46" width="880" height="150" fill="#EBF5FB" stroke="#AAAAAA" stroke-width="0.8"/>
  <rect x="10" y="46" width="70" height="150" fill="#1F4E79" stroke="#1F4E79" stroke-width="0.5"/>
  <text x="45" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial" transform="rotate(-90,45,122)">CUSTOMER</text>

  <!-- Loan Officer -->
  <rect x="10" y="196" width="880" height="190" fill="#F5F0FF" stroke="#AAAAAA" stroke-width="0.8"/>
  <rect x="10" y="196" width="70" height="190" fill="#4B2D9E" stroke="#4B2D9E" stroke-width="0.5"/>
  <text x="45" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial" transform="rotate(-90,45,291)">LOAN OFFICER</text>

  <!-- Bank Manager -->
  <rect x="10" y="386" width="880" height="120" fill="#FFFBEA" stroke="#AAAAAA" stroke-width="0.8"/>
  <rect x="10" y="386" width="70" height="120" fill="#B07C00" stroke="#B07C00" stroke-width="0.5"/>
  <text x="45" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial" transform="rotate(-90,45,446)">BANK MGR</text>

  <!-- Vehicle Dealer -->
  <rect x="10" y="506" width="880" height="120" fill="#F1F1F1" stroke="#AAAAAA" stroke-width="0.8"/>
  <rect x="10" y="506" width="70" height="120" fill="#444444" stroke="#444444" stroke-width="0.5"/>
  <text x="45" y="566" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial" transform="rotate(-90,45,566)">DEALER</text>

  <!-- ── START EVENT ── -->
  <circle cx="108" cy="122" r="14" fill="#ffffff" stroke="#1F4E79" stroke-width="2"/>
  <text x="108" y="148" text-anchor="middle" font-size="10" fill="#1F4E79" font-family="Arial">Start</text>

  <!-- ── CUSTOMER TASKS ── -->
  <!-- Task 1: Visit branch -->
  <rect x="134" y="100" width="120" height="44" rx="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="194" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Visit branch</text>
  <text x="194" y="132" text-anchor="middle" font-size="9" fill="#E1F5EE" font-family="Arial">enquire about loan</text>
  <line x1="122" y1="122" x2="134" y2="122" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Task 2: Fill form -->
  <rect x="274" y="100" width="120" height="44" rx="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="334" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Fill application</text>
  <text x="334" y="132" text-anchor="middle" font-size="9" fill="#E1F5EE" font-family="Arial">collect KYC docs</text>
  <line x1="254" y1="122" x2="274" y2="122" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Task 3: Submit docs -->
  <rect x="414" y="100" width="120" height="44" rx="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="474" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Submit form</text>
  <text x="474" y="132" text-anchor="middle" font-size="9" fill="#E1F5EE" font-family="Arial">+ KYC documents</text>
  <line x1="394" y1="122" x2="414" y2="122" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Task 8: Sign agreement -->
  <rect x="680" y="100" width="120" height="44" rx="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="740" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Sign loan</text>
  <text x="740" y="132" text-anchor="middle" font-size="9" fill="#E1F5EE" font-family="Arial">agreement / form</text>

  <!-- Arrow submit → verify (down) -->
  <line x1="474" y1="144" x2="474" y2="196" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ── LOAN OFFICER TASKS ── -->
  <!-- Task 4: Verify docs -->
  <rect x="414" y="212" width="120" height="44" rx="6" fill="#7F77DD" stroke="#534AB7" stroke-width="0.8"/>
  <text x="474" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Verify documents</text>
  <text x="474" y="244" text-anchor="middle" font-size="9" fill="#EEEDFE" font-family="Arial">check eligibility</text>
  <line x1="474" y1="256" x2="474" y2="278" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="474,280 510,316 474,352 438,316" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="474" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" font-family="Arial">Eligible</text>
  <text x="474" y="325" text-anchor="middle" font-size="9" fill="#333" font-family="Arial">?</text>

  <!-- Approved → sanction letter -->
  <rect x="610" y="298" width="130" height="44" rx="6" fill="#7F77DD" stroke="#534AB7" stroke-width="0.8"/>
  <text x="675" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Prepare sanction</text>
  <text x="675" y="330" text-anchor="middle" font-size="9" fill="#EEEDFE" font-family="Arial">letter</text>
  <line x1="510" y1="316" x2="610" y2="316" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="558" y="308" text-anchor="middle" font-size="9" fill="#375623" font-family="Arial">✓ Approved</text>

  <!-- Rejected → end -->
  <line x1="438" y1="316" x2="108" y2="316" stroke="#C00000" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="270" y="308" text-anchor="middle" font-size="9" fill="#C00000" font-family="Arial">✗ Rejected — inform customer</text>
  <circle cx="108" cy="316" r="14" fill="#ffffff" stroke="#C00000" stroke-width="2.5"/>
  <circle cx="108" cy="316" r="9" fill="#ffffff" stroke="#C00000" stroke-width="1.5"/>
  <text x="108" y="340" text-anchor="middle" font-size="9" fill="#C00000" font-family="Arial">End</text>

  <!-- Incomplete → resubmit (loop back) -->
  <line x1="474" y1="352" x2="474" y2="374" stroke="#B07C00" stroke-width="1"/>
  <line x1="474" y1="374" x2="334" y2="374" stroke="#B07C00" stroke-width="1"/>
  <line x1="334" y1="374" x2="334" y2="144" stroke="#B07C00" stroke-width="1" marker-end="url(#arr-amber)"/>
  <text x="404" y="386" text-anchor="middle" font-size="9" fill="#B07C00" font-family="Arial">⚠ Incomplete docs — resubmit</text>

  <!-- Sanction letter → sign agreement (up to customer) -->
  <line x1="740" y1="298" x2="740" y2="144" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ── BANK MANAGER LANE ── -->
  <rect x="610" y="406" width="130" height="44" rx="6" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
  <text x="675" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#412402" font-family="Arial">Final approval</text>
  <text x="675" y="438" text-anchor="middle" font-size="9" fill="#633806" font-family="Arial">sign off &amp; disburse</text>
  <line x1="675" y1="386" x2="675" y2="406" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ── VEHICLE DEALER LANE ── -->
  <!-- Receive disbursement -->
  <rect x="480" y="526" width="130" height="44" rx="6" fill="#888780" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="545" y="544" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Receive loan</text>
  <text x="545" y="558" text-anchor="middle" font-size="9" fill="#F1EFE8" font-family="Arial">disbursement amount</text>

  <!-- Deliver vehicle -->
  <rect x="630" y="526" width="130" height="44" rx="6" fill="#888780" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="695" y="544" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">Deliver vehicle</text>
  <text x="695" y="558" text-anchor="middle" font-size="9" fill="#F1EFE8" font-family="Arial">to customer</text>
  <line x1="610" y1="548" x2="630" y2="548" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Manager → dealer arrow -->
  <line x1="675" y1="450" x2="675" y2="506" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="675" y1="506" x2="545" y2="506" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="545" y1="506" x2="545" y2="526" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="608" y="500" text-anchor="middle" font-size="9" fill="#555" font-family="Arial">disburse to dealer</text>

  <!-- End event main -->
  <circle cx="810" cy="548" r="14" fill="#ffffff" stroke="#1F4E79" stroke-width="3"/>
  <circle cx="810" cy="548" r="9" fill="#ffffff" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="810" y="574" text-anchor="middle" font-size="10" fill="#1F4E79" font-family="Arial">End</text>
  <line x1="760" y1="548" x2="796" y2="548" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- LEGEND -->
  <rect x="10" y="640" width="880" height="70" rx="6" fill="#F8F8F8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="26" y="660" font-size="11" font-weight="bold" fill="#1F4E79" font-family="Arial">Legend</text>
  <circle cx="110" cy="676" r="8" fill="none" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="125" y="680" font-size="9" fill="#333" font-family="Arial">Start event</text>
  <rect x="200" y="668" width="50" height="20" rx="4" fill="#1D9E75"/>
  <text x="259" y="680" font-size="9" fill="#333" font-family="Arial">Customer task</text>
  <rect x="350" y="668" width="50" height="20" rx="4" fill="#7F77DD"/>
  <text x="408" y="680" font-size="9" fill="#333" font-family="Arial">Officer task</text>
  <rect x="490" y="668" width="50" height="20" rx="4" fill="#EF9F27"/>
  <text x="548" y="680" font-size="9" fill="#333" font-family="Arial">Manager task</text>
  <polygon points="640,678 654,668 668,678 654,688" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="678" y="680" font-size="9" fill="#333" font-family="Arial">Decision gateway</text>

  <!-- Pain point note -->
  <text x="450" y="726" text-anchor="middle" font-size="10" font-style="italic" fill="#888" font-family="Arial">⚠ Pain points: TAT 7–14 days · manual errors · no customer visibility · branch dependency · no scalability</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C00000" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B07C00" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>
</body>
</html>
